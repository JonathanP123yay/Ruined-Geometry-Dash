name: Build Ruined Geometry Dash

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
          - name: iOS
            os: macos-latest
            target: iOS
          - name: Android32
            os: ubuntu-latest
            target: Android32
          - name: Android64
            os: ubuntu-latest
            target: Android64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Geode mod
        uses: geode-sdk/build-geode-mod@main
        with:
          path: ./Ruining geometry dash
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Combine platform builds
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Combine builds
        uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - name: Upload final Geode package
        uses: actions/upload-artifact@v4
        with:
          name: Ruined-Geometry-Dash
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error